name: Website prototype checks
on:
  push:
    branches: ["arena/d188298f-fcdl"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: jacquard_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: PHP syntax and API tests
        run: bash website/tests/smoke.sh
      - name: Package website
        run: |
          cd website
          zip -qr ../jacquard-website.zip public private راهنمای-نصب.md
      - uses: actions/upload-artifact@v4
        with:
          name: Jacquard-Website-Prototype
          path: jacquard-website.zip
          retention-days: 30
