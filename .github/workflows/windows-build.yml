name: Windows preview and installer
on:
  push:
    branches: ["arena/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and smoke-test on Windows
        run: |
          dotnet build src/LicenseIssuer/LicenseIssuer.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/JacquardStudio/JacquardStudio.csproj -c Release *> build-log.txt
          $code = $LASTEXITCODE
          Get-Content build-log.txt
          if ($code -ne 0) {
            $message = ((Get-Content build-log.txt | Select-Object -Last 35) -join '%0A').Replace('%', '%25').Replace('%250A', '%0A')
            Write-Output "::error title=Build details::$message"
            exit $code
          }
          $env:JACQUARD_EXPECTED_LICENSE_KEY = (Resolve-Path 'Docs/private-key.public.pem').Path
          dotnet run --project tests/JacquardStudio.Smoke/JacquardStudio.Smoke.csproj -c Release *> smoke-log.txt
          $code = $LASTEXITCODE
          Get-Content smoke-log.txt
          if ($code -ne 0) {
            $message = ((Get-Content smoke-log.txt | Select-Object -Last 35) -join '%0A').Replace('%', '%25').Replace('%250A', '%0A')
            Write-Output "::error title=Smoke details::$message"
            exit $code
          }
      - name: Publish self-contained Windows x64 application
        run: |
          dotnet publish src/JacquardStudio/JacquardStudio.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'artifacts/publish/THIRD-PARTY-NOTICES.txt')) { throw 'Published application is missing its third-party notices.' }
          $pem = [System.IO.File]::ReadAllText((Resolve-Path 'Docs/private-key.public.pem').Path)
          $published = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Resolve-Path 'artifacts/publish/JacquardStudio.dll').Path))
          if (-not $published.Contains($pem)) { throw 'Published application does not contain the expected public key.' }
          Write-Host 'Published application contains the owner public key.'
      - name: Publish license issuer prototype
        run: |
          dotnet publish src/LicenseIssuer/LicenseIssuer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/license-issuer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path artifacts/license-issuer/LicenseIssuer.exe)) { throw "Single-file issuer executable is missing" }
      - name: Build installer
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Installer validation::$($_.Exception.Message)"; exit 1 }
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not installed on this runner" }
          $version = (Get-Content version.txt -Raw).Trim()
          $binaryVersion = $version -replace '[-+].*$', ''
          if ($binaryVersion -notmatch '^\d+(?:\.\d+){1,3}$') { throw "Invalid numeric installer version: $binaryVersion" }
          $buildTimestamp = [DateTimeOffset]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'", [System.Globalization.CultureInfo]::InvariantCulture)
          & $iscc "/DAppVersion=$version" "/DBinaryVersion=$binaryVersion" "/DBuildTimestamp=$buildTimestamp" packaging/JacquardStudio.iss *> installer-build-log.txt
          $compilerExitCode = $LASTEXITCODE
          Get-Content installer-build-log.txt
          if ($compilerExitCode -ne 0) {
            $details = ((Get-Content installer-build-log.txt | Select-Object -Last 40) -join '%0A').Replace('%', '%25').Replace('%250A', '%0A')
            Write-Output "::error title=Installer compiler details::$details"
            exit $compilerExitCode
          }
          $setup = Get-ChildItem artifacts/installer/*Setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'Installer EXE is missing.' }
          $setupInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($setup.FullName)
          if ($setupInfo.CompanyName -ne 'Mirkhalili') { throw "Installer publisher metadata is missing: $($setupInfo.CompanyName)" }
          if ($setupInfo.ProductName -ne 'Jacquard Studio') { throw "Installer product metadata is incorrect: $($setupInfo.ProductName)" }
          if ($setupInfo.FileVersion -ne $version -or $setupInfo.ProductVersion -ne $version) { throw "Installer text version metadata is incorrect: file=$($setupInfo.FileVersion), product=$($setupInfo.ProductVersion)" }
          if ($setupInfo.OriginalFilename -ne 'JacquardStudio-Setup.exe') { throw "Installer original filename metadata is incorrect: $($setupInfo.OriginalFilename)" }
          if ($setupInfo.FileDescription -notmatch 'Designed by Mirkhalili' -or $setupInfo.FileDescription -notmatch [regex]::Escape($buildTimestamp)) { throw "Installer description/design/build-date metadata is incomplete: $($setupInfo.FileDescription)" }
          $binaryParts = @($binaryVersion.Split('.') | ForEach-Object { [int]$_ })
          while ($binaryParts.Count -lt 4) { $binaryParts += 0 }
          if ($setupInfo.FileMajorPart -ne $binaryParts[0] -or $setupInfo.FileMinorPart -ne $binaryParts[1] -or $setupInfo.FileBuildPart -ne $binaryParts[2] -or $setupInfo.FilePrivatePart -ne $binaryParts[3]) { throw "Installer numeric file version metadata is incorrect: $($setupInfo.FileVersion)" }
          $md5 = (Get-FileHash $setup.FullName -Algorithm MD5).Hash
          $sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          Set-Content artifacts/installer/MD5.txt $md5 -NoNewline -Encoding ascii
          Set-Content artifacts/installer/SHA256.txt $sha256 -NoNewline -Encoding ascii
          Copy-Item version.txt artifacts/installer/version.txt
      - name: Download previous preview for upgrade test
        uses: actions/download-artifact@v4
        with:
          name: JacquardStudio-Windows-x64
          path: artifacts/previous
          run-id: 42583915488
          github-token: ${{ github.token }}
      - name: Test per-user installer upgrade
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Upgrade test::$($_.Exception.Message)"; exit 1 }
          $old = Get-ChildItem artifacts/previous/*Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $old) { throw "Previous artifact unavailable; cannot verify upgrade." }
          $dir = Join-Path $env:RUNNER_TEMP "JacquardUpgradeTest"
          $params = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir")
          $oldResult = Start-Process -FilePath $old.FullName -ArgumentList $params -Wait -PassThru
          if ($oldResult.ExitCode -ne 0) { throw "Old installer failed: $($oldResult.ExitCode)" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C0E5A7E-DF2A-4D61-9039-B9EC80CD87AD}_is1'
          $before = Get-ItemProperty $key
          if ($before.DisplayVersion -ne '028.0.0.2-a1') { throw "Old version not found: $($before.DisplayVersion)" }
          $new = (Get-ChildItem artifacts/installer/*Setup.exe | Select-Object -First 1).FullName
          $newResult = Start-Process -FilePath $new -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -Wait -PassThru
          if ($newResult.ExitCode -ne 0) { throw "New installer failed: $($newResult.ExitCode)" }
          $after = Get-ItemProperty $key
          if ($after.DisplayVersion -ne (Get-Content version.txt -Raw).Trim()) { throw "Upgrade version incorrect: $($after.DisplayVersion)" }
          if ($after.Publisher -ne 'Mirkhalili') { throw "Installed publisher metadata is missing: $($after.Publisher)" }
          if ($after.Comments -notmatch 'Designed by Mirkhalili') { throw "Installed designer metadata is missing: $($after.Comments)" }
          if ($after.InstallLocation.TrimEnd('\') -ne $dir.TrimEnd('\')) { throw 'Upgrade did not retain install directory' }
          $productEntries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Jacquard Studio*' })
          if ($productEntries.Count -ne 1) { throw "Expected one installed product, found $($productEntries.Count)" }
          $repeat = Start-Process -FilePath $new -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -Wait -PassThru
          if ($repeat.ExitCode -ne 0) { throw "Repeat install failed: $($repeat.ExitCode)" }
          $productEntries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Jacquard Studio*' })
          if ($productEntries.Count -ne 1) { throw "Repeat install created a second product entry" }
          $fileVersion = (Get-Item (Join-Path $dir 'JacquardStudio.exe')).VersionInfo.FileVersion
          [xml]$project = Get-Content 'src/JacquardStudio/JacquardStudio.csproj'
          $expectedFileVersion = $project.Project.PropertyGroup.FileVersion
          if ($fileVersion -ne $expectedFileVersion) { throw "Executable not updated: $fileVersion" }
          $uninstaller = Join-Path $dir 'unins000.exe'
          $uninstallResult = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallResult.ExitCode -ne 0) { throw "Uninstall failed: $($uninstallResult.ExitCode)" }
          Write-Host 'Install, upgrade, and uninstall verified.'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JacquardStudio-Windows-x64
          path: artifacts/installer/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload license issuer prototype
        uses: actions/upload-artifact@v4
        with:
          name: Jacquard-License-Issuer-Prototype
          path: artifacts/license-issuer/LicenseIssuer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Assemble permanent release downloads
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $release = 'artifacts/release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item 'artifacts/installer/JacquardStudio-Setup.exe' "$release/JacquardStudio-Setup.exe"
          Copy-Item 'artifacts/installer/version.txt' "$release/version.txt"
          Copy-Item 'artifacts/installer/MD5.txt' "$release/MD5.txt"
          Copy-Item 'artifacts/installer/SHA256.txt' "$release/SHA256.txt"
          Copy-Item 'artifacts/license-issuer/LicenseIssuer.exe' "$release/Jacquard-LicenseIssuer.exe"
          Copy-Item 'src/JacquardStudio/Assets/sam-emblem.png' "$release/sam-emblem-high-resolution.png"
          $site = Join-Path $env:RUNNER_TEMP 'JacquardStudio-website'
          New-Item -ItemType Directory -Force -Path "$site/public", "$site/private" | Out-Null
          Copy-Item 'website/public/*' "$site/public" -Recurse
          Copy-Item 'website/private/config.example.php', 'website/private/schema.sql', 'website/private/migrate-038-to-039.sql', 'website/private/migrate-039-to-040.sql' "$site/private"
          Copy-Item 'website/راهنمای-نصب.md' "$site/راهنمای-نصب.md"
          Copy-Item 'Docs/THIRD-PARTY-NOTICES.md' "$site/THIRD-PARTY-NOTICES.md"
          Compress-Archive -Path "$site/*" -DestinationPath "$release/JacquardStudio-website-updated.zip" -CompressionLevel Optimal

      - name: Publish permanent GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Jacquard Studio ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/release/JacquardStudio-Setup.exe
            artifacts/release/version.txt
            artifacts/release/MD5.txt
            artifacts/release/SHA256.txt
            artifacts/release/Jacquard-LicenseIssuer.exe
            artifacts/release/JacquardStudio-website-updated.zip
            artifacts/release/sam-emblem-high-resolution.png
