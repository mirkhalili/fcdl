name: Windows preview and installer
on:
  push:
    branches: ["arena/d188298f-fcdl"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and smoke-test on Windows
        run: |
          dotnet build src/JacquardStudio/JacquardStudio.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/JacquardStudio.Smoke/JacquardStudio.Smoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows x64 application
        run: |
          dotnet publish src/JacquardStudio/JacquardStudio.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not installed on this runner" }
          $version = (Get-Content version.txt -Raw).Trim()
          & $iscc "/DAppVersion=$version" packaging/JacquardStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash artifacts/installer/*.exe -Algorithm SHA256 | Format-List | Out-File artifacts/installer/SHA256.txt
      - name: Download previous preview for upgrade test
        uses: actions/download-artifact@v4
        with:
          name: JacquardStudio-Windows-x64
          path: artifacts/previous
          run-id: 42254395260
          github-token: ${{ github.token }}
      - name: Test per-user installer upgrade
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Upgrade test::$($_.Exception.Message)"; exit 1 }
          $old = Get-ChildItem artifacts/previous/*Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $old) { throw "Previous artifact unavailable; cannot verify upgrade." }
          $dir = Join-Path $env:RUNNER_TEMP "JacquardUpgradeTest"
          $params = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir")
          $oldResult = Start-Process -FilePath $old.FullName -ArgumentList $params -Wait -PassThru
          if ($oldResult.ExitCode -ne 0) { throw "Old installer failed: $($oldResult.ExitCode)" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5C0E5A7E-DF2A-4D61-9039-B9EC80CD87AD}_is1'
          $before = Get-ItemProperty $key
          if ($before.DisplayVersion -ne '005.2.2.0-a1') { throw "Old version not found: $($before.DisplayVersion)" }
          $new = (Get-ChildItem artifacts/installer/*Setup.exe | Select-Object -First 1).FullName
          $newResult = Start-Process -FilePath $new -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -Wait -PassThru
          if ($newResult.ExitCode -ne 0) { throw "New installer failed: $($newResult.ExitCode)" }
          $after = Get-ItemProperty $key
          if ($after.DisplayVersion -ne (Get-Content version.txt -Raw).Trim()) { throw "Upgrade version incorrect: $($after.DisplayVersion)" }
          if ($after.InstallLocation.TrimEnd('\') -ne $dir.TrimEnd('\')) { throw 'Upgrade did not retain install directory' }
          $productEntries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Jacquard Studio*' })
          if ($productEntries.Count -ne 1) { throw "Expected one installed product, found $($productEntries.Count)" }
          $repeat = Start-Process -FilePath $new -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -Wait -PassThru
          if ($repeat.ExitCode -ne 0) { throw "Repeat install failed: $($repeat.ExitCode)" }
          $productEntries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like 'Jacquard Studio*' })
          if ($productEntries.Count -ne 1) { throw "Repeat install created a second product entry" }
          $fileVersion = (Get-Item (Join-Path $dir 'JacquardStudio.exe')).VersionInfo.FileVersion
          if ($fileVersion -ne '6.2.3.0') { throw "Executable not updated: $fileVersion" }
          $uninstaller = Join-Path $dir 'unins000.exe'
          $uninstallResult = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallResult.ExitCode -ne 0) { throw "Uninstall failed: $($uninstallResult.ExitCode)" }
          Write-Host 'Install, upgrade, and uninstall verified.'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JacquardStudio-Windows-x64
          path: artifacts/installer/*
          if-no-files-found: error
          retention-days: 30
